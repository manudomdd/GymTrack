services:
  db:
    image: mysql:8.0
    container_name: gymtrack_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-manu}
      MYSQL_DATABASE: gymtrack_v2
      MYSQL_USER: ${DB_USER:-manu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-manu}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  api_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymtrack_backend
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=gymtrack_v2
      - DB_USER=${DB_USER:-manu}
      - DB_PASSWORD=${DB_PASSWORD:-manu}
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
